name: Windows 构建与验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: 还原固定版本 BCU
        run: .\Initialize-Dependencies.ps1
      # 注册表重命名兼容性核验完成前不自动执行写入测试或提供未验收的下载包。
      - name: 仅编译（动态验收与打包暂停）
        run: dotnet build .\app-inventory\AppInventory.csproj -c Release --nologo -v minimal
